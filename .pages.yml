# Pages CMS config — https://pagescms.org
# Install the Pages CMS GitHub App on this repo, then edit at app.pagescms.org.
#
# Everything a person writes lives in content/. Everything derivable is derived
# at build time by .eleventy.js: the srcset ladders, the `sizes` strings, the
# width/height attributes that hold the layout still while images load, the
# print-JPEG swap, and the collage grid on each deck page. Editing here can
# never produce broken markup, because there is no markup to edit.

# rename: safe rewrites the uploaded filename to something that survives being
# dropped into a srcset. Without it "Ö Sommar bild (2).JPG" is stored verbatim,
# and srcset separates a URL from its width descriptor on whitespace — so the
# markup is invalid per the HTML grammar even though browsers currently cope.
# On a Swedish site edited by a non-technical person that is the ordinary case.
#
# extensions keeps out HEIC, the iPhone default: scripts/build-images.py cannot read it,
# so it would commit fine and then fail the build with a message pointing at a
# script that cannot help.
media:
  - name: projects
    label: Project images
    input: assets/images/projects
    output: /assets/images/projects
    categories: [image]
    extensions: [jpg, jpeg, png]
    rename: safe
  - name: berensson
    label: Anders Berensson Architects
    input: assets/images/berensson
    output: /assets/images/berensson
    categories: [image]
    extensions: [jpg, jpeg, png]
    rename: safe
  - name: athh
    label: AT–HH
    input: assets/images/athh
    output: /assets/images/athh
    categories: [image]
    extensions: [jpg, jpeg, png]
    rename: safe
  - name: codesign
    label: Codesign
    input: assets/images/codesign
    output: /assets/images/codesign
    categories: [image]
    extensions: [jpg, jpeg, png]
    rename: safe
  - name: photography
    label: Photography
    input: assets/images/photography
    output: /assets/images/photography
    categories: [image]
    extensions: [jpg, jpeg, png]
    rename: safe

content:
  - name: projects
    label: Projects
    type: collection
    path: content/projects
    filename: "{fields.slug}.md"
    view:
      fields: [title, order, year, location]
      primary: title
      sort: [order, title, year]
      default:
        sort: order
        order: asc
    fields:
      - {
          name: title,
          label: Title,
          type: string,
          required: true,
          description: "Shown over the images, in capitals",
        }
      - {
          name: slug,
          label: Web address,
          type: string,
          required: true,
          pattern: "^[a-z0-9-]+$",
          description: "This project's own web address, e.g. rosehallgren.se/rock-stage. Lowercase letters, numbers and hyphens. Changing it does not redirect: the old address stops working for anyone who has shared or bookmarked it, and search engines drop the page. Best left alone once a project is published.",
        }
      - {
          name: order,
          label: Position,
          type: number,
          required: true,
          description: "Lower numbers come first. The projects list is sorted by this — change it to move a project up or down the page.",
        }
      - {
          name: color,
          label: Colour,
          type: string,
          required: true,
          pattern: "^#[0-9a-fA-F]{6}$",
          description: "The ground this project sits on, as a hex code like #604e3e. It fills the text panel, the page behind the images, and the browser chrome on the project's own page. The first project's colour is also the background of the intro at the top of the site, and the last project's is the footer. Keep it dark: the title and the dots are set in white on it, and they need to stay legible.",
        }
      - {
          name: year,
          label: Year,
          type: string,
          description: "e.g. 2022, or a span like 2021–2023. Not shown on the page: it goes into the PDF, and into the data search engines and link previews read.",
        }
      - {
          name: location,
          label: Place,
          type: string,
          description: "Where the work is, e.g. Stockholm, or Torö, Nynäshamn. A place, not an organisation — it is published as a place in the page's structured data. Not shown on the page: it goes into the PDF, after the year.",
        }
      - name: links
        label: Links
        type: object
        description: "Optional. Links shown at the end of the text — the practice that ran the project, the festival that hosted it, a collaborator's page. Drag to reorder."
        list:
          collapsible: { collapsed: true, summary: "{label}" }
        fields:
          - { name: label, label: Link text, type: string }
          - { name: url, label: URL, type: string, pattern: "^$|^https?://" }
      - name: credits
        label: Credits
        type: string
        list: true
        description: "One per line, each on its own row: practice, then role, then photographer. e.g. “Anders Berensson Architects”, “Rose Hallgren, Architect”, “Photo: Linda Hutchins”."
      - name: press
        label: Press
        type: object
        description: "Where the project was written about. These print as a Press line under the credits, separate from the Links above, which are for the practice or festival behind the work."
        list:
          collapsible: { collapsed: true, summary: "{label}" }
        fields:
          - { name: label, label: Publication, type: string }
          - { name: url, label: URL, type: string, pattern: "^$|^https?://" }
      - name: media
        label: Images and video
        required: true
        type: object
        description: "Drag to reorder. The FIRST image is the one shown with the title and used as the large image on the PDF page; the rest become the collage on the following page. A video can sit anywhere in the list. Keep it to 20 images or fewer. At 21 the PDF gives the project a third page."
        list:
          collapsible: { collapsed: true, summary: "{alt}{title}" }
        fields:
          - {
              name: file,
              label: Image,
              type: image,
              # A single name, not a list. Pages CMS reads options.media only
              # when it is a string; given an array it silently falls back to
              # the first media entry, so the picker would have browsed
              # assets/images/projects either way — but by accident, and with
              # four entries here implying a choice that does not exist.
              # Images already committed under berensson/athh/codesign/
              # photography keep rendering; new uploads land in projects/.
              options: { media: projects },
            }
          - {
              name: alt,
              label: Description,
              type: string,
              description: "What is in the picture, for people who cannot see it. One short sentence.",
            }
          - {
              name: drawing,
              label: This is a drawing or plan,
              type: boolean,
              description: "Tick for plans, sections and maps. In the PDF these get a soft background and are fitted whole instead of being cropped, so the linework is never sliced through.",
            }
          - {
              name: video,
              label: YouTube ID (instead of an image),
              type: string,
              description: "Only for a video. The code after v= in a YouTube link, e.g. yn3Wk3m__r0. Leave the image above empty.",
            }
          - {
              name: title,
              label: Video title,
              type: string,
              description: "Only for a video.",
            }
      - {
          name: body,
          label: Text,
          type: text,
          description: "The project description. Leave a blank line between paragraphs. A line containing only --- splits the text onto a second slide, for long descriptions.",
        }
      - {
          name: lang,
          label: Title language,
          type: select,
          options:
            {
              values:
                [
                  { value: "", label: "English" },
                  { value: "sv", label: "Swedish" },
                ],
            },
          description: "Rarely needed. Set to Swedish only for a Swedish title — Torö, Folkbastu, Jag är Gud, Järva Stadspark, Drömmarens Malmö — so a screen reader reading the page in English still pronounces it as Swedish. Leave as English for everything else.",
        }

  - name: settings
    label: Intro and contact
    type: file
    path: content/settings.json
    fields:
      - name: site
        label: Intro
        type: object
        fields:
          - {
              name: title,
              label: Browser tab title,
              type: string,
              required: true,
            }
          - {
              name: heading,
              label: Heading,
              type: string,
              required: true,
              description: "The main heading at the top of the page.",
            }
          - name: intro
            label: Intro text
            type: rich-text
            required: true
            # format: html because the template prints this straight into the
            # page. Markdown would need a converter at build time for no gain.
            # switcher leaves an escape hatch to the underlying HTML without
            # making that the default way in. media: false because there are no
            # images in the intro itself — the portrait beside it is the
            # Portrait field below.
            options:
              format: html
              switcher: true
              media: false
            description: "Select a word and use the link button to add a link. Enter starts a new paragraph."
          - {
              name: description,
              label: "Search description",
              type: text,
              required: true,
              description: "The text search engines and link previews show (~150 characters).",
            }
          - {
              name: studio_name,
              label: Studio name,
              type: string,
              description: "The name above the address at the foot of the PDF.",
            }
          - {
              name: studio_address,
              label: Studio address,
              type: string,
              description: "Street and number only, e.g. Åsögatan 122. The postcode and city are added around it.",
            }
          - {
              name: studio_postcode,
              label: Studio postcode,
              type: string,
              description: "e.g. 116 24.",
            }
          - {
              name: studio_phone,
              label: Studio phone,
              type: string,
              description: "Shown on the cover of the PDF.",
            }
          - name: portrait
            label: Portrait
            type: image
            options: { media: projects }
            description: "The photograph beside the intro. Shown only on wide screens — there is no room for it on a phone, where it pushed the contact links off the bottom. Leave blank to remove it."
          - {
              name: portrait_alt,
              label: Portrait description,
              type: string,
              description: "What is in the portrait, for people who cannot see it. One short sentence.",
            }
          - {
              name: social_title,
              label: "Share title",
              type: string,
              description: "Headline shown when someone shares the site on social media. Leave blank to use the browser tab title.",
            }
          - name: social_images
            label: "Share images"
            type: image
            list: true
            options: { media: projects }
            description: "The pictures shown when the site is shared or linked. The first is the one almost everywhere will use; the rest are alternatives some platforms let a person choose between. Any shape will do — each is cropped to the 1200 by 630 that link previews are laid out at, from the middle, so put the subject near the centre."
          - {
              name: social_image,
              label: "Share image (old field, no longer used)",
              type: image,
              options: { media: projects },
              description: "Superseded by Share images above. Kept so nothing breaks if that list is emptied.",
            }
          - {
              name: social_image_alt,
              label: "Share image description",
              type: string,
              description: "What is in the share image, for people who cannot see it.",
            }
      - name: contact
        label: Contact links
        type: object
        list:
          collapsible: { collapsed: true, summary: "{label}" }
        fields:
          - { name: label, label: Label, type: string, required: true }
          - { name: url, label: URL, type: string, required: true }
          - {
              name: print,
              label: "Printed as",
              type: string,
              description: "What the PDF prints instead of the label, e.g. the full email address. Leave blank to print the label.",
            }
          - {
              name: footer_only,
              label: "Only show at the foot of the page",
              type: boolean,
              description: "Tick to keep this link out of the intro and show it only in the footer.",
            }
