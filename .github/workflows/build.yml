name: Build page from content

# Pages CMS commits Rose's edits straight to master. This turns those edits
# into the page: validate, render index.html, and commit it back.
#
# It deliberately does NOT use the GitHub Pages deploy action. This repo is
# served with build_type: legacy — Pages publishes the root of master directly
# — and assets/images alone is 534MB already in git. Switching to artifact
# deployment would upload half a gigabyte on every text edit to republish a
# page that changes by a few kilobytes. Committing index.html back keeps the
# existing serving path exactly as it is.

on:
  push:
    branches: [master]
    paths:
      - 'content/**'
      - 'src/**'
      - '.eleventy.js'
      - 'scripts/**'
      - 'assets/css/src/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/build.yml'
      # The source photographs. Pages CMS uploads into these, and until the
      # image build ran here a new upload failed validation with "run
      # ./build-images.sh" — a script that did not exist — so Rose's edit never
      # reached the page. The derivative directories (avif, w, print, wash) are
      # deliberately NOT listed: this workflow writes them, and a push made with
      # GITHUB_TOKEN does not start another run, but there is no reason to
      # depend on that.
      - 'assets/images/projects/**'
      - 'assets/images/photography/**'
      - 'assets/images/berensson/**'
      - 'assets/images/codesign/**'
      - 'assets/images/athh/**'
  workflow_dispatch: # manual "rebuild now" button

permissions:
  contents: write

concurrency:
  group: build-page
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # ImageMagick, AVIF and WebP encoders. Ubuntu packages ImageMagick 6,
      # whose binary is `convert` and which ships no `magick` at all;
      # build-images.py resolves whichever is present.
      - name: Install image tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq imagemagick libavif-bin webp

      # Before validate, because validate is what fails on a missing
      # derivative. Only builds what is out of date, so a text-only edit does
      # nothing here and costs a few seconds.
      - name: Build image derivatives
        run: python3 scripts/build-images.py

      # styles.css is generated from assets/css/src/. Building it here means a
      # partial edited through any route reaches the page, and --check would
      # catch the built file being edited directly instead.
      - name: Build the stylesheet
        run: node scripts/build-css.js

      # Fails the run on a missing image, a duplicate web address, an empty
      # title — before anything can reach the live page.
      - run: npm run validate

      - run: npx eleventy

      - name: Publish
        run: node scripts/publish.js

      - name: Commit the rebuilt pages
        run: |
          # Both generated pages, not just index.html: /admin/ is built from
          # src/admin.njk too, and leaving it out meant a change there rendered
          # in CI and was then thrown away.
          # Every generated page: the home page, /admin/, the sitemap, and one
          # directory per project. Listing them by name stopped publishing
          # whatever was added next, which is exactly what happened when the
          # project pages appeared.
          # The derivatives too, not only the pages: an upload that generated
          # them here and did not commit them would publish a page whose srcset
          # points at files that are not in the repository.
          # share/ was missing here when share cards were added, so CI would
          # generate one and throw it away. styles.css is generated too, from
          # assets/css/src/.
          DERIVED="assets/images/avif assets/images/w assets/images/print"
          DERIVED="$DERIVED assets/images/wash assets/images/share assets/css/styles.css"
          if git diff --quiet -- '*.html' sitemap.xml $DERIVED; then
            echo "no generated page, image or stylesheet changed — nothing to commit"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add '*.html' sitemap.xml $DERIVED
          git commit -m "Rebuild pages from content

          Generated by .github/workflows/build.yml from content/. Edit the
          content in Pages CMS, not these files."
          git push
