name: Build page from content

# Pages CMS commits Rose's edits straight to master. This turns those edits
# into the page: validate, render index.html, and commit it back.
#
# It deliberately does NOT use the GitHub Pages deploy action. This repo is
# served with build_type: legacy — Pages publishes the root of master directly
# — and assets/images alone is 534MB already in git. Switching to artifact
# deployment would upload half a gigabyte on every text edit to republish a
# page that changes by a few kilobytes. Committing index.html back keeps the
# existing serving path exactly as it is.

on:
  push:
    branches: [master]
    paths:
      - 'content/**'
      - 'src/**'
      - '.eleventy.js'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/build.yml'
  workflow_dispatch: # manual "rebuild now" button

permissions:
  contents: write

concurrency:
  group: build-page
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Fails the run on a missing image, a duplicate web address, an empty
      # title — before anything can reach the live page.
      - run: npm run validate

      - run: npx eleventy

      - name: Publish
        run: node scripts/publish.js

      - name: Commit the rebuilt page
        run: |
          if git diff --quiet -- index.html; then
            echo "index.html unchanged — nothing to commit"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Rebuild index.html from content

          Generated by .github/workflows/build.yml from content/. Edit the
          content in Pages CMS, not this file."
          git push
