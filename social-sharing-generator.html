<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0" />
    <title>Social Sharing Image Generator - Rose Hallgren</title>
    <style>
      body {
        margin: 0;
        padding: 0;
        font-family: "Arial", sans-serif;
        background: linear-gradient(135deg, #f5f5f5 0%, #e8e8e8 100%);
      }

      .social-card {
        width: 1200px;
        height: 630px;
        background: linear-gradient(135deg, #ffffff 0%, #f8f8f8 100%);
        position: relative;
        overflow: hidden;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 60px;
        box-sizing: border-box;
      }

      .content-left {
        flex: 1;
        z-index: 2;
      }

      .name {
        font-size: 48px;
        font-weight: 700;
        color: #1a1a1a;
        margin: 0 0 20px 0;
        line-height: 1.1;
      }

      .title {
        font-size: 28px;
        font-weight: 400;
        color: #666;
        margin: 0 0 30px 0;
        line-height: 1.2;
      }

      .description {
        font-size: 20px;
        color: #444;
        line-height: 1.4;
        margin: 0 0 20px 0;
        max-width: 500px;
      }

      .location {
        font-size: 18px;
        color: #888;
        margin: 0;
      }

      .visual-right {
        flex: 1;
        position: relative;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .project-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 20px;
        width: 100%;
        max-width: 400px;
      }

      .project-item {
        background: #f0f0f0;
        border-radius: 8px;
        padding: 20px;
        text-align: center;
        font-size: 14px;
        font-weight: 600;
        color: #333;
        border: 2px solid #e0e0e0;
      }

      .project-item:nth-child(1) {
        background: #e8f4f8;
        border-color: #b8d4e0;
      }
      .project-item:nth-child(2) {
        background: #f0f8e8;
        border-color: #d0e0b8;
      }
      .project-item:nth-child(3) {
        background: #f8f0e8;
        border-color: #e0d0b8;
      }
      .project-item:nth-child(4) {
        background: #f8e8f0;
        border-color: #e0b8d0;
      }

      .decorative-elements {
        position: absolute;
        top: 0;
        right: 0;
        width: 200px;
        height: 200px;
        background: linear-gradient(45deg, rgba(26, 26, 26, 0.1), rgba(26, 26, 26, 0.05));
        border-radius: 50%;
        z-index: 1;
      }

      .decorative-elements::before {
        content: "";
        position: absolute;
        top: 50px;
        right: 50px;
        width: 100px;
        height: 100px;
        background: linear-gradient(45deg, rgba(26, 26, 26, 0.08), rgba(26, 26, 26, 0.03));
        border-radius: 50%;
      }

      .decorative-elements::after {
        content: "";
        position: absolute;
        top: 100px;
        right: 100px;
        width: 50px;
        height: 50px;
        background: linear-gradient(45deg, rgba(26, 26, 26, 0.06), rgba(26, 26, 26, 0.02));
        border-radius: 50%;
      }

      .print-button {
        position: fixed;
        top: 20px;
        right: 20px;
        background: #1a1a1a;
        color: white;
        border: none;
        padding: 15px 30px;
        border-radius: 5px;
        cursor: pointer;
        font-size: 16px;
        z-index: 1000;
      }

      .print-button:hover {
        background: #333;
      }

      @media print {
        .print-button {
          display: none;
        }
        .social-card {
          width: 1200px !important;
          height: 630px !important;
          margin: 0 !important;
          padding: 60px !important;
        }
      }
    </style>
  </head>
  <body>
    <button
      class="print-button"
      onclick="window.print()">
      Generate Social Image
    </button>

    <div class="social-card">
      <div class="content-left">
        <h1 class="name">Rose Hallgren</h1>
        <p class="title">Multidisciplinary Architect & Designer</p>
        <p class="description">
          Exploring innovative intersections of architecture, weaving, ceramics, and contemporary spatial design. Based in Stockholm,
          Sweden.
        </p>
        <p class="location">Stockholm, Sweden</p>
      </div>

      <div class="visual-right">
        <div class="project-grid">
          <div class="project-item">Folkbastu</div>
          <div class="project-item">COUA</div>
          <div class="project-item">Drip Drop Non Stop</div>
          <div class="project-item">Drömmarens Malmö</div>
        </div>
        <div class="decorative-elements"></div>
      </div>
    </div>

    <script>
      // Instructions for generating the social sharing image
      console.log("Instructions for generating social sharing image:");
      console.log('1. Click the "Generate Social Image" button');
      console.log('2. In the print dialog, select "Save as PDF" or "Print to Image"');
      console.log("3. Set the page size to 1200x630 pixels");
      console.log('4. Save the image as "social-sharing-rose-hallgren.jpg"');
      console.log("5. Place the image in the assets/images/ folder");
    </script>
  </body>
</html>
